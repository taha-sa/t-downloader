<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>T-Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>T-Downloader</h1>
  <p id="status" class="status" data-string="ExtChecking"></p>
  <label class="row">
    <input type="checkbox" id="capture">
    <span data-string="ExtCapture"></span>
  </label>
  <label class="row" id="siteRow" hidden>
    <input type="checkbox" id="sitePause">
    <span id="siteLabel" data-string="ExtPauseSite"></span>
  </label>
  <p id="hint" class="hint"></p>
  <script src="../localization.js"></script>
  <script src="popup.js"></script>
</body>
</html>
