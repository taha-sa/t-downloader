name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  extension-localization:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated extension resources
        shell: powershell
        run: ./tools/Export-ExtensionStrings.ps1 -Check
      - name: Test browser extension
        run: node extension/tests/run.mjs
  ci:
    uses: taha-sa/t-suite/.github/workflows/app-ci.yml@main
    with:
      app_project: src/TDownloader.App/TDownloader.App.csproj
      test_projects: |
        tests/TDownloader.Core.Tests/TDownloader.Core.Tests.csproj
        tests/TDownloader.Host.Tests/TDownloader.Host.Tests.csproj
      dotnet_version: '10.0.x'
    secrets:
      TSUITE_READ_TOKEN: ${{ secrets.TSUITE_READ_TOKEN }}
